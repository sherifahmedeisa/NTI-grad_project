<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!------------------- navbar --------------->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" href="#">VisioCreate</a>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Shop</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Product</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Contact Us</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="#" class=" d-none d-md-block text-decoration-none text-dark"><i
                        class="fa-solid fa-magnifying-glass"></i></a>
                <a href="sign in.html" class="d-none d-md-block text-decoration-none text-dark"><i
                        class="fa-regular fa-circle-user "></i></a>
                <a href="#" class="text-decoration-none text-dark position-relative"><i class="fa-solid fa-store"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark"
                        style="font-size: 0.6rem;">2</span></a>

            </div>
        </div>
    </nav>
    <!-- sign in -->
    <section>
        <div class="container">
            <div class="row bg-sign">
                <div class="col-md-6 col-12  sign-img  position-relative">
                    <img src="image/slide2.jfif" alt="" class="border rounded-2">
                    <span
                        class="text-white position-absolute top-0 start-50 translate-middle-x mt-3 fw-bold text-center">Visicreate</span>
                </div>
                <div class="col-md-6 col-12 d-flex flex-column justify-content-center p-4 p-md-5">
                    <span class="fw-bold">Sign in</span>
                    <p>Don't have an accout yet? <span class=" text-success">Sign Up</span></p>
                    <form id="registerForm">
                        <div class="border-bottom p-1 mb-3 row ">
                            <input type="text" name="" id="userEmailInput" placeholder="Your username or email address"
                                class=" col-12 border-0">
                            <small class="text-danger"></small>
                        </div>
                        <div class="border-bottom p-1 mb-4 d-flex">
                            <input type="password" name="" id="userPasswordInput" placeholder="Password"
                                class="sign-input border-0 col-12"><i class="fa-regular fa-eye"></i>
                            <small class="text-danger"></small>
                        </div>
                    </form>
                    <div class="d-flex justify-content-between">
                        <div>
                            <input type="checkbox" name="" id="">
                            <label for="">Remember me</label>
                        </div>
                        <div>
                            <span class="fw-bold">Forget Password?</span>
                        </div>
                    </div>
                    <div class="border rounded-2 text-center bg-info mt-3">
                        <button class="border-0 bg-transparent" id="userButton">Sign in</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>

</html>
